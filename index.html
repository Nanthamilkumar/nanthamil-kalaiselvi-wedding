<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Nanthamil & Kalaiselvi</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <main class="language-container">

        <!-- ENGLISH INVITATION -->
        <section class="invitation english-invitation">

            <div class="symbol">
                🌸
            </div>

            <div class="subtitle">
                Wedding Invitation
            </div>

            <div class="couple">

                <div>
                    Nanthamil S
                </div>

                <div class="heart">
                    ❤️
                </div>

                <div>
                    Kalaiselvi M
                </div>

            </div>

            <div class="date">
                17 September 2026
            </div>

           <a href="english.html" class="button">
    View Invitation
</a>

        </section>


        <!-- TAMIL INVITATION -->
        <section class="invitation tamil-invitation">

            <div class="symbol">
                🌺
            </div>

            <div class="subtitle tamil-text">
                திருமண அழைப்பிதழ்
            </div>

            <div class="couple tamil-text">

                <div>
                    நந்தமிழ் S
                </div>

                <div class="heart">
                    ❤️
                </div>

                <div>
                    கலைச்செல்வி M
                </div>

            </div>

            <div class="date tamil-text">
                17 செப்டம்பர் 2026
            </div>

           <a href="tamil.html" class="button tamil-text">
    அழைப்பிதழ் பார்க்க
</a>

        </section>
<!-- =========================================
     WEDDING COUNTDOWN
     ========================================= -->

<section class="countdown-section">

    <p class="countdown-label">
        OUR SPECIAL DAY
    </p>

    <h2>
        Counting Down to Our Wedding
    </h2>

    <p class="countdown-date">
        17 September 2026
    </p>


    <div class="countdown">

        <div class="countdown-box">

            <span id="days">
                00
            </span>

            <small>
                Days
            </small>

        </div>


        <div class="countdown-box">

            <span id="hours">
                00
            </span>

            <small>
                Hours
            </small>

        </div>


        <div class="countdown-box">

            <span id="minutes">
                00
            </span>

            <small>
                Minutes
            </small>

        </div>


        <div class="countdown-box">

            <span id="seconds">
                00
            </span>

            <small>
                Seconds
            </small>

        </div>

    </div>

</section>
    </main>
<script src="script.js"></script>
</body>

</html>
